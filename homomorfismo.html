<title>Simulador de homomorfismos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: una sola pantalla (sin scroll). Filas fijas y compactas; la gráfica toma todo el alto que sobra. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --ink:#151933; --muted:#596080; --line:#DCDFEB;
  --accent:#2546C4; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB;
  --cA:#2546C4; --cB:#8E2BAA; --cFa:#1C8A4C; --cFb:#C26A00;
  --grid:#E6E8F1; --axis:#8A90AD;
  --ok:#1C7F53; --ok-soft:#DDF3E8; --bad:#B93434; --bad-soft:#F9E1E1;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#161A2E; --ink:#E7E9F5; --muted:#9BA1C2; --line:#2A3052;
  --accent:#93A7FF; --accent-ink:#0D1020; --accent-soft:#1E2752;
  --cA:#93A7FF; --cB:#D58BEB; --cFa:#5BD08C; --cFb:#F2A65A;
  --grid:#1F2440; --axis:#6E7499;
  --ok:#55C893; --ok-soft:#12321F; --bad:#FF8A8A; --bad-soft:#3B1818; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2E; --ink:#E7E9F5; --muted:#9BA1C2; --line:#2A3052;
  --accent:#93A7FF; --accent-ink:#0D1020; --accent-soft:#1E2752;
  --cA:#93A7FF; --cB:#D58BEB; --cFa:#5BD08C; --cFb:#F2A65A;
  --grid:#1F2440; --axis:#6E7499;
  --ok:#55C893; --ok-soft:#12321F; --bad:#FF8A8A; --bad-soft:#3B1818; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden}
.app{height:100%;max-width:640px;margin:0 auto;display:grid;grid-template-rows:auto auto auto auto minmax(150px,1fr) auto auto;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.cA{color:var(--cA)} .cB{color:var(--cB)} .cFa{color:var(--cFa)} .cFb{color:var(--cFb)}
.m{font-family:var(--f-mono)}

/* funciones */
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.presets::-webkit-scrollbar{display:none}
.btn{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* fórmula */
.formula{font-family:var(--f-mono);font-weight:700;font-size:clamp(17px,5.4vw,24px);text-align:center;white-space:nowrap}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;text-align:center;min-width:0}
.box.a{border-color:var(--cA)} .box.b{border-color:var(--cB)}
.box small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.box .m{font-size:clamp(12px,3.5vw,17px);font-weight:600;display:block;overflow-wrap:anywhere}

/* deslizadores */
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sliders label{display:flex;flex-direction:column;gap:0;font-size:13px;font-weight:700;min-width:0}
.sliders input{width:100%;accent-color:var(--accent);margin:2px 0 0}

/* gráfica */
.plot{position:relative;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.plot canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.legend{position:absolute;left:6px;right:6px;top:6px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.tog{pointer-events:auto;display:flex;align-items:center;gap:6px;font:inherit;font-family:var(--f-mono);font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 8px;cursor:pointer;opacity:.95}
.tog.off{opacity:.4;text-decoration:line-through}
.sw{display:inline-block;width:16px;border-top:3px solid currentColor}
.sw.dash{border-top-style:dashed}

/* lectura y veredicto */
.read{font-family:var(--f-mono);font-size:13.5px;display:flex;flex-direction:column;gap:1px;white-space:nowrap;overflow:hidden}
.read span{overflow:hidden;text-overflow:ellipsis}
.verdict{border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:3px}
.verdict.good{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict .note{font-weight:400;color:var(--ink);font-size:13px}
.verdict .note b{font-weight:700}
</style>

<main class="app">
  <div class="presets" id="presets" role="group" aria-label="Función f"></div>

  <p class="formula"><span class="cA">f(a <span id="op">+</span> b)</span> = <span class="cFa">f(a)</span> <span class="cB" id="opT">+</span> <span class="cFb">f(b)</span></p>

  <div class="ab">
    <div class="box a"><small>A · una función</small><span class="m cA" id="fA"></span></div>
    <div class="box b"><small>B · dos funciones con *′</small><span class="m" id="fB"></span></div>
  </div>

  <div class="sliders">
    <label for="sa"><span>a = <span class="m cFa" id="va"></span> <span style="color:var(--muted);font-weight:400">(eje x)</span></span><input type="range" id="sa"></label>
    <label for="sb"><span>b = <span class="m cFb" id="vb"></span> <span style="color:var(--muted);font-weight:400">(fijo)</span></span><input type="range" id="sb"></label>
  </div>

  <div class="plot" id="plot">
    <canvas id="cv" aria-label="Gráfica de A y B"></canvas>
    <div class="legend" id="legend">
      <button class="tog cA" data-c="A"><span class="sw"></span>A</button>
      <button class="tog cB" data-c="B"><span class="sw dash"></span>B</button>
      <button class="tog cFa" data-c="Fa"><span class="sw"></span>f(x)</button>
      <button class="tog cFb" data-c="Fb"><span class="sw"></span>f(b)</button>
    </div>
  </div>

  <div class="read" id="read"></div>
  <div class="verdict" id="ver"></div>
</main>

<script>
(function(){
const $ = s => document.querySelector(s);
const mod = (a,n) => ((a%n)+n)%n;
const fmt = x => { if (!isFinite(x)) return '—'; const r = Math.round(x); return Math.abs(x-r)<1e-9 ? String(r) : String(+x.toFixed(3)); };
const par = v => v < 0 ? `(${fmt(v)})` : fmt(v);
const sgn = v => v < 0 ? `− ${fmt(-v)}` : `+ ${fmt(v)}`;
const c = (cls, t) => `<span class="${cls}">${t}</span>`;
const G = [
  {name:'3x', op:'+', opT:'+', f:x=>3*x, s:(a,b)=>a+b, t:(u,v)=>u+v, xr:[-4,4], yr:[-22,22], br:[-3,3], b0:2, a0:1, st:.1, hom:true,
   A:b=>`3(x ${sgn(b)})`, Fa:'3x'},
  {name:'2ˣ', op:'+', opT:'·', f:x=>Math.pow(2,x), s:(a,b)=>a+b, t:(u,v)=>u*v, xr:[-4,3], yr:[-2,34], br:[-2,2], b0:1, a0:1, st:.1, hom:true,
   A:b=>`2<sup>x ${sgn(b)}</sup>`, Fa:'2ˣ'},
  {name:'log x', op:'·', opT:'+', f:x=>Math.log10(x), s:(a,b)=>a*b, t:(u,v)=>u+v, xr:[0.05,10], yr:[-1.6,2], br:[.2,5], b0:2, a0:5, st:.05, hom:true,
   A:b=>`log(${fmt(b)}·x)`, Fa:'log x'},
  {name:'x² ✗', op:'+', opT:'+', f:x=>x*x, s:(a,b)=>a+b, t:(u,v)=>u+v, xr:[-4,4], yr:[-3,32], br:[-3,3], b0:2, a0:1, st:.1, hom:false,
   A:b=>`(x ${sgn(b)})²`, Fa:'x²'},
  {name:'x + 1 ✗', op:'+', opT:'+', f:x=>x+1, s:(a,b)=>a+b, t:(u,v)=>u+v, xr:[-4,4], yr:[-8,10], br:[-3,3], b0:2, a0:1, st:.1, hom:false,
   A:b=>`(x ${sgn(b)}) + 1`, Fa:'x + 1'},
  {name:'n mod 3', op:'+', opT:'+₃', f:x=>mod(x,3), s:(a,b)=>a+b, t:(u,v)=>(u+v)%3, xr:[-6,6], yr:[-.6,3.2], br:[-5,5], b0:2, a0:2, st:1, disc:true, hom:true,
   A:b=>`(x ${sgn(b)}) mod 3`, Fa:'x mod 3'},
];
let g = G[0], a = 1, b = 2;
const show = {A:true, B:true, Fa:true, Fb:true};
const sa = $('#sa'), sb = $('#sb');
$('#presets').innerHTML = G.map((p,i)=>`<button class="btn" data-i="${i}">${p.name}</button>`).join('');
$('#presets').addEventListener('click', e=>{ const t=e.target.closest('button'); if(t) load(G[+t.dataset.i]); });
$('#legend').addEventListener('click', e=>{ const t=e.target.closest('.tog'); if(!t) return; const k=t.dataset.c; show[k]=!show[k]; t.classList.toggle('off', !show[k]); draw(); });
sa.addEventListener('input', ()=>{ a = +sa.value; update(); });
sb.addEventListener('input', ()=>{ b = +sb.value; update(); });

function load(p){
  g = p; a = p.a0; b = p.b0;
  document.querySelectorAll('#presets .btn').forEach((t,i)=>t.classList.toggle('on', G[i]===p));
  Object.assign(sa, {min:p.xr[0], max:p.xr[1], step:p.st, value:a});
  Object.assign(sb, {min:p.br[0], max:p.br[1], step:p.st, value:b});
  $('#op').textContent = p.op; $('#opT').textContent = p.opT;
  update();
}
const opName = o => ({'+':'la suma','·':'la multiplicación','+₃':'la suma mod 3'})[o] || o;

function update(){
  $('#va').textContent = fmt(a); $('#vb').textContent = fmt(b);
  const fb = g.f(b);
  $('#fA').innerHTML = `A(x) = ${g.A(b)}`;
  $('#fB').innerHTML = `B(x) = ${c('cFa', g.Fa)} ${c('cB', g.opT)} ${c('cFb', fmt(fb))}`;
  const ab = g.s(a,b), A = g.f(ab), fa = g.f(a), B = g.t(fa,fb);
  $('#read').innerHTML =
    `<span class="cA">A = f(${fmt(a)} ${g.op} ${par(b)}) = f(${fmt(ab)}) = <b>${fmt(A)}</b></span>`+
    `<span class="cB">B = ${c('cFa', fmt(fa))} ${g.opT} ${c('cFb', fmt(fb))} = <b>${fmt(B)}</b></span>`;
  const eqHere = Math.abs(A-B) < 1e-9*Math.max(1,Math.abs(A));
  const v = $('#ver');
  let main;
  if (g.hom){ v.className='verdict good'; main = '✓ A = B en todo x: las curvas se enciman. f es homomorfismo.'; }
  else if (eqHere){ v.className='verdict bad'; main = '✗ A = B solo en este punto; en el resto se separan. f NO es homomorfismo.'; }
  else { v.className='verdict bad'; main = `✗ A = ${fmt(A)} ≠ B = ${fmt(B)}: curvas distintas. f NO es homomorfismo.`; }
  // caso especial: b es la identidad
  const eS = g.op==='·' ? 1 : 0, eT = g.opT==='·' ? 1 : 0;
  let note = '';
  if (Math.abs(b - eS) < 1e-9){
    const ok = Math.abs(fb - eT) < 1e-9;
    note = `<span class="note"><b>Caso especial: b = ${eS} es la identidad de ${opName(g.op)}.</b> Por eso ${c('cA','A')} = ${c('cFa','f(x)')}, cosa que pasa con cualquier función. `+
      (ok ? `Además ${c('cFb',`f(${eS}) = ${fmt(fb)}`)} es la identidad de ${opName(g.opT)}: <b>f(e) = e′</b> ✓. Todo homomorfismo lo cumple, pero no basta: mueve b.`
          : `Pero ${c('cFb',`f(${eS}) = ${fmt(fb)}`)} no es la identidad de ${opName(g.opT)} (${eT}): <b>f(e) ≠ e′</b> ✗, por eso B se separa.`)+`</span>`;
  }
  v.innerHTML = `<span>${main}</span>${note}`;
  draw();
}

const cv = $('#cv'), ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceStep(range, n){ const raw = range/n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function draw(){
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!W || !H) return;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const [x0,x1] = g.xr, [y0,y1] = g.yr, pad = 6;
  const X = x => pad + (x-x0)/(x1-x0)*(W-2*pad), Y = y => H-pad - (y-y0)/(y1-y0)*(H-2*pad);
  const col = {A:css('--cA'), B:css('--cB'), Fa:css('--cFa'), Fb:css('--cFb'), grid:css('--grid'), axis:css('--axis'), ink:css('--muted'), bg:css('--bg')};
  ctx.clearRect(0,0,W,H);
  ctx.font = '11px ' + css('--f-mono');
  const sx = niceStep(x1-x0, 8), sy = niceStep(y1-y0, Math.max(3, Math.round(H/45)));
  ctx.lineWidth = 1; ctx.strokeStyle = col.grid;
  for (let x = Math.ceil(x0/sx)*sx; x <= x1; x += sx){ ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),H); ctx.stroke(); }
  for (let y = Math.ceil(y0/sy)*sy; y <= y1; y += sy){ ctx.beginPath(); ctx.moveTo(0,Y(y)); ctx.lineTo(W,Y(y)); ctx.stroke(); }
  const ax = Math.min(Math.max(0,x0),x1), ay = Math.min(Math.max(0,y0),y1);
  ctx.strokeStyle = col.axis; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0,Y(ay)); ctx.lineTo(W,Y(ay)); ctx.moveTo(X(ax),0); ctx.lineTo(X(ax),H); ctx.stroke();
  ctx.fillStyle = col.ink;
  for (let x = Math.ceil(x0/sx)*sx; x <= x1+1e-9; x += sx){ if (Math.abs(x)<1e-9) continue; ctx.textAlign='center'; ctx.fillText(fmt(x), X(x), Math.min(H-4, Y(ay)+14)); }
  for (let y = Math.ceil(y0/sy)*sy; y <= y1+1e-9; y += sy){ if (Math.abs(y)<1e-9) continue; ctx.textAlign='left'; ctx.fillText(fmt(y), X(ax)+5, Y(y)-3); }
  ctx.textAlign='right'; ctx.fillText('x = a', W-8, Y(ay)-6);
  const fns = { A: x => g.f(g.s(x,b)), B: x => g.t(g.f(x), g.f(b)), Fa: x => g.f(x), Fb: () => g.f(b) };
  const styles = {Fa:{w:2,dash:[]}, Fb:{w:2,dash:[]}, A:{w:6,dash:[],alpha:.55}, B:{w:3,dash:[9,7]}};
  for (const k of ['Fa','Fb','A','B']){
    if (!show[k]) continue;
    const st = styles[k]; ctx.strokeStyle = col[k]; ctx.fillStyle = col[k]; ctx.globalAlpha = st.alpha || 1;
    if (g.disc){
      for (let x = Math.ceil(x0); x <= x1; x++){
        const y = fns[k](x); if (!isFinite(y)) continue;
        ctx.beginPath();
        if (k==='B'){ ctx.lineWidth = 2.5; ctx.arc(X(x),Y(y),9,0,7); ctx.stroke(); }
        else if (k==='A'){ ctx.arc(X(x),Y(y),6,0,7); ctx.fill(); }
        else { ctx.arc(X(x),Y(y),k==='Fa'?3.5:2.5,0,7); ctx.fill(); }
      }
      if (k==='Fb'){ ctx.setLineDash([3,4]); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,Y(fns.Fb())); ctx.lineTo(W,Y(fns.Fb())); ctx.stroke(); ctx.setLineDash([]); }
    } else {
      ctx.lineWidth = st.w; ctx.setLineDash(st.dash); ctx.beginPath();
      let pen = false; const N = 500;
      for (let i=0;i<=N;i++){
        const x = x0 + (x1-x0)*i/N, y = fns[k](x);
        if (!isFinite(y) || y < y0-(y1-y0) || y > y1+(y1-y0)){ pen = false; continue; }
        if (pen) ctx.lineTo(X(x),Y(y)); else { ctx.moveTo(X(x),Y(y)); pen = true; }
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = col.axis; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(a),0); ctx.lineTo(X(a),H); ctx.stroke(); ctx.setLineDash([]);
  for (const [k,y,r] of [['Fa',fns.Fa(a),5],['Fb',fns.Fb(),5],['A',fns.A(a),7],['B',fns.B(a),11]]){
    if (!show[k] || !isFinite(y) || y<y0 || y>y1) continue;
    ctx.beginPath(); ctx.arc(X(a),Y(y),r,0,7);
    if (k==='B'){ ctx.strokeStyle = col.B; ctx.lineWidth = 3; ctx.stroke(); }
    else { ctx.fillStyle = col[k]; ctx.fill(); ctx.strokeStyle = col.bg; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
}
function pick(e){
  const r = cv.getBoundingClientRect(), [x0,x1] = g.xr;
  let x = x0 + (e.clientX - r.left - 6)/(r.width-12)*(x1-x0);
  x = Math.round(x/g.st)*g.st; x = Math.min(x1, Math.max(x0, x));
  a = +x.toFixed(4); sa.value = a; update();
}
let drag = false;
cv.addEventListener('pointerdown', e=>{ drag = true; cv.setPointerCapture(e.pointerId); pick(e); });
cv.addEventListener('pointermove', e=>{ if (drag) pick(e); });
cv.addEventListener('pointerup', ()=>{ drag = false; });
if ('ResizeObserver' in window) new ResizeObserver(draw).observe($('#plot')); else addEventListener('resize', draw);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw); } catch(e){}
new MutationObserver(draw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
load(G[0]);
})();
</script>
